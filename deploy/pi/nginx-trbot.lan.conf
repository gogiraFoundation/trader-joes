# Pi nginx reverse proxy for tr_bot (LAN only).
#
# 1. Replace GOGIR_SERVER_LAN_IP below with gogir-server's LAN address (e.g. 192.168.1.50).
# 2. Copy to the Pi, e.g.:
#      sudo cp deploy/pi/nginx-trbot.lan.conf /etc/nginx/sites-available/trbot.lan
#      sudo ln -sf /etc/nginx/sites-available/trbot.lan /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. Pi-hole Local DNS: trbot.lan -> THIS Pi's LAN IP (not the bot server IP).
#
# Do not port-forward 80/443/8080 on the router for this service.

upstream tr_bot_api {
    # set upstream to gogir-server LAN IP
    server GOGIR_SERVER_LAN_IP:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name trbot.lan;

    location / {
        proxy_pass http://tr_bot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
