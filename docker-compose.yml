volumes:
  tr_bot_artifacts:

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: tr_bot
      POSTGRES_PASSWORD: tr_bot
      POSTGRES_DB: tr_bot
    ports:
      - "5433:5432"

  api:
    build: .
    command: uvicorn tr_bot.health:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://tr_bot:tr_bot@db:5432/tr_bot
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - tr_bot_artifacts:/app/artifacts
    depends_on:
      - redis
      - db

  bot:
    build: .
    command: python -m tr_bot
    environment:
      SYMBOL: BTC/USDT
      TIMEFRAME: 5m
      PAPER_TRADING: "true"
      USE_LLM: "false"
      POLL_SECONDS: 300
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://tr_bot:tr_bot@db:5432/tr_bot
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - tr_bot_artifacts:/app/artifacts
    depends_on:
      - redis
      - db
